[project]
name = "asr-eval"
version = "0.1.0"
description = "ADR-0005 ASR WER benchmark harness (Round A, FLEURS sw_ke)"
requires-python = ">=3.12"
dependencies = [
  "datasets>=3.0.0",
  "soundfile>=0.12.1",
  "jiwer>=3.0.4",
  "google-genai>=0.5.0",
  "google-cloud-speech>=2.27.0",
  "huggingface-hub>=0.25.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asr_eval"]
