name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  moon-ci:
    # Quoted: the unquoted "affected: " (colon-space) made this a YAML
    # mapping-value error, which GitHub Actions rejects at workflow-PARSE
    # time -- every run failed at 0s with "workflow file issue" and NO job
    # (lint/typecheck/integration/docker-scan) ever executed. Quoting the
    # scalar fixes the parse so CI actually runs.
    name: "moon ci (affected: lint, typecheck, test, build — Node + Python)"
    runs-on: ubuntu-latest
    services:
      # Real Postgres + pgvector for packages/db and services/api
      # integration tests (DATABASE_URL_TEST below) — not used by the
      # default unit-test task, which still runs against in-memory
      # doubles per services/api/src/repositories/in-memory.ts.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fact_checker_ke
          POSTGRES_PASSWORD: fact_checker_ke
          POSTGRES_DB: fact_checker_ke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fact_checker_ke" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://fact_checker_ke:fact_checker_ke@localhost:5432/fact_checker_ke
      DATABASE_URL_DIRECT: postgres://fact_checker_ke:fact_checker_ke@localhost:5432/fact_checker_ke
      CI: true
      VITE_API_URL: http://localhost:8080
      VITE_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          # ADR-0014: moon needs full history to compute the affected set
          # (`moon ci` diffs HEAD against a base) — a shallow clone makes
          # affected detection inaccurate or fail entirely.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Node dependencies (brings in @moonrepo/cli)
        run: pnpm install --frozen-lockfile
      - name: Sync Python dependencies (services/pipeline)
        run: uv sync
        working-directory: services/pipeline
      - name: Run migrations against the service-container Postgres
        run: pnpm --filter @fact-checker-ke/db db:migrate
      # ADR-0014 AT-0014-1/AT-0014-2: affected-only, across every toolchain.
      # --base/--head are the documented flags for comparing revisions
      # (moonrepo.dev/docs/guides/ci#comparing-revisions); MOON_BASE/
      # MOON_HEAD env vars take highest precedence if both are set, so we
      # only pass --base explicitly for a pull_request (merge-base against
      # the PR's target branch) and let moon auto-detect on a direct push
      # to main (falls back to vcs.defaultBranch~HEAD).
      - name: moon ci
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            moon ci --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          else
            moon ci
          fi
      # The integration step below calls `test:integration` DIRECTLY (via
      # pnpm --filter), NOT through moon -- so it must not rely on the
      # `moon ci` step above having happened to build packages/db in its
      # affected set. @fact-checker-ke/db + @fact-checker-ke/core resolve via
      # their package `exports` to ./dist (not src), `pnpm install` has no
      # prepare/build hook, and a stale/absent dist missing the ADR-0035
      # `demonstrationMedia`/`demonstrationStatusEvents` exports makes
      # `schema.demonstrationMedia` undefined at runtime -> GET /v1/maandamano
      # 500s (drizzle getTableColumns(undefined)) when the kill switch is OFF.
      # `moon run db:build` builds core first (db dependsOn core + ^:build),
      # is a cache hit when `moon ci` already built it, and guarantees a
      # current dist regardless of the affected set.
      - name: Build @fact-checker-ke/db (+ core) so the integration tests import a current dist
        run: moon run db:build
      - name: Test (integration, real Postgres)
        run: pnpm --filter @fact-checker-ke/api test:integration
  contracts-drift:
    name: Contracts drift gate (gen:contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate packages/core/generated/contracts.schema.json and services/pipeline/app/models/generated.py
        run: pnpm gen:contracts
      - name: Fail if regenerating produced a diff (contracts drifted from their source zod schemas)
        run: git diff --exit-code -- packages/core/generated services/pipeline/app/models/generated.py
  docker-images:
    name: Build & scan container images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Base images are Docker Hardened Images (dhi.io). The Community tier
      # is free, but the registry still gates pulls behind `docker login
      # dhi.io` — use the same Docker Hub account/PAT as any other Docker
      # Hub pull.
      - name: Log in to dhi.io
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build API image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fact-checker-ke/api:ci
      - name: Build pipeline image (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: services/pipeline
          file: services/pipeline/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fact-checker-ke/pipeline:ci
      - name: Trivy scan — API image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fact-checker-ke/api:ci
          severity: CRITICAL
          exit-code: "1"
      - name: Trivy scan — API image (report HIGH, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fact-checker-ke/api:ci
          severity: HIGH
          exit-code: "0"
      - name: Trivy scan — pipeline image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fact-checker-ke/pipeline:ci
          severity: CRITICAL
          exit-code: "1"
      - name: Trivy scan — pipeline image (report HIGH, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fact-checker-ke/pipeline:ci
          severity: HIGH
          exit-code: "0"
