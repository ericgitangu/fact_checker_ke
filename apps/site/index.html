<!doctype html>

    <!-- Resolves the theme before first paint (localStorage choice, else
         prefers-color-scheme) so dark-mode visitors never see a light
         flash. Mirrors src/use-theme.ts, which takes over afterwards. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fck-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* storage blocked — default light styles apply */
        }
      })();
    </script>
