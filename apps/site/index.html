<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- apps/site is retired to a redirect stub: the marketing site was
         folded into the single frontend at
         https://fact-checker-ke-web.vercel.app (ADR-0010/0015 amendments).
         The authoritative redirect is the 308 in vercel.json; this document
         is only served if that rule is ever absent. -->
    <title>fact_checker_ke — moved</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://fact-checker-ke-web.vercel.app/" />
    <!-- Static fallback: forward even with JavaScript disabled. The bundled
         script (src/main.tsx -> src/redirect.ts) does the path/query/hash-
         preserving redirect; this meta refresh is the no-JS floor. -->
    <meta http-equiv="refresh" content="0; url=https://fact-checker-ke-web.vercel.app/" />
  </head>
  <body>
    <p>
      fact_checker_ke has moved to
      <a href="https://fact-checker-ke-web.vercel.app/">fact-checker-ke-web.vercel.app</a>.
    </p>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
