$schema: 'https://moonrepo.dev/schemas/project.yml'

# apps/site is a retired redirect-only stub (ADR-0010/0015 amendments,
# 2026-10-04): the marketing site was folded into apps/web. It no longer
# depends on @fact-checker-ke/core or /brand (those imports went with the
# marketing components), so the former `dependsOn` on them is gone. The
# only task that matters here is `build`, which emits the static redirect
# bundle (index.html + the tiny client-fallback script); the authoritative
# redirect is the 308 in vercel.json.
#
# lint/typecheck/test/build are inherited from .moon/tasks/node.yml.

tasks:
  build:
    outputs:
      - 'dist/**'
