[project]
name = "fact-checker-ke-pipeline"
version = "0.0.0"
description = "fact_checker_ke claim pipeline (normalize, transcribe, extract, retrieve, draft)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic[email]>=2.10.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "httpx>=0.28.1",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
  "datamodel-code-generator>=0.83.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
