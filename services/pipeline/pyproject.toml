[project]
name = "fact-checker-ke-pipeline"
version = "0.0.0"
description = "fact_checker_ke claim pipeline (normalize, transcribe, extract, retrieve, draft)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic[email]>=2.10.4",
  "httpx>=0.28.1",
  "anthropic>=0.69.0",
  "fastembed>=0.5.1",
  "c2pa-python>=0.38.0",
  # ADR-0032 (two-engine pivot), migration 0013: the first real Postgres
  # driver dependency in this service. Sync client (not asyncpg) is a
  # deliberate choice — app/protocols/fetch_dedup_store.py's
  # FetchDedupStore Protocol (and app/stores/engine_breaker.py's
  # EngineCostBreaker Protocol) are both sync, same as every other
  # Protocol in this service (CheckStore, IdempotencyStore); keeping the
  # Postgres-backed implementations sync avoids an async-Protocol
  # refactor across every existing caller/test double.
  "psycopg[binary]>=3.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
  "datamodel-code-generator>=0.83.0",
  "piexif>=1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
artifacts = ["app/data/*.json", "app/eval/fixtures/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: exercises a real vendor API (Anthropic); skipped unless the relevant API key is set in the environment",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# c2pa-python (ADR-0006 provenance check) ships no py.typed marker / stubs
# as of 0.38.0 -- verified via `uv run mypy app` failing with
# import-untyped before this override. Third-party gap, not ours to fix;
# narrowly scoped to this one module rather than a blanket
# ignore_missing_imports.
module = "c2pa"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# piexif (test-only, dev dependency group): used solely to craft synthetic
# EXIF/GPS fixtures in tests/test_media_processing.py; ships no stubs.
module = "piexif"
ignore_missing_imports = true
