# Local dev only. Run with `docker compose up`. Not used for deployment —
# Neon/Upstash are the real targets per docs/adr/0009-runtime-topology.md.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fact_checker_ke
      POSTGRES_PASSWORD: fact_checker_ke
      POSTGRES_DB: fact_checker_ke
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fact_checker_ke"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      platforms:
        - linux/amd64
    profiles: ["app"]
    environment:
      PORT: "8080"
      NODE_ENV: development
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: services/pipeline
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    profiles: ["app"]
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
